<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>蝴蝶飞跃 - 小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: linear-gradient(180deg, #2b3a67 0%, #4b5d9e 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #game-wrap {
    position: relative;
    width: 480px;
    height: 640px;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    overflow: hidden;
  }
  #game-canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px 0;
    text-align: center;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 28, 55, .72);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    color: #fff;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 34px; letter-spacing: 4px; }
  #overlay p  { font-size: 15px; color: #cfd6ff; line-height: 1.8; }
  #btn-start {
    padding: 14px 46px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #2b3a67;
    background: linear-gradient(135deg, #ffd76e, #ffb347);
    border: none;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    transition: transform .15s ease;
  }
  #btn-start:hover { transform: scale(1.06); }
  #btn-start:active { transform: scale(.97); }
  #final-score { font-size: 26px; color: #ffd76e; font-weight: bold; }
</style>
</head>
<body>

<div id="game-wrap">
  <canvas id="game-canvas" width="480" height="640"></canvas>
  <div id="hud">跨越障碍：<span id="score">0</span></div>

  <div id="overlay">
    <h1 id="overlay-title">蝴蝶飞跃</h1>
    <p id="overlay-tip">电脑：按住 <b>A</b> 键向上飞，松开自然下落<br>手机：点击或按住屏幕任意位置即可飞<br>开局蝴蝶会悬浮片刻，穿过障碍物缝隙即可得分</p>
    <div id="final-score" style="display:none;">得分：0</div>
    <button id="btn-start">开始游戏</button>
  </div>
</div>

<script>
"use strict";
var CONFIG = { W:480, H:640, gravity:0.10, thrust:-0.20, maxUp:-2.0, maxDown:2.6,
  butterflyX:120, butterflyR:13, obstacleW:62, gapH:170, speed:0.7, spawnGap:320, graceFrames:120 };

var canvas=document.getElementById("game-canvas"), ctx=canvas.getContext("2d");
var hudScore=document.getElementById("score"), overlay=document.getElementById("overlay");
var title=document.getElementById("overlay-title"), tip=document.getElementById("overlay-tip");
var finalEl=document.getElementById("final-score"), startBtn=document.getElementById("btn-start");
var gameWrap=document.getElementById("game-wrap");

var state="menu", score=0, frames=0, flying=false;
var butterfly={ y:CONFIG.H/2, vy:0 };
var obstacles=[], spawnX=0, graceLeft=0;

window.addEventListener("keydown",function(e){ if(e.key==="a"||e.key==="A"){ flying=true; e.preventDefault(); } });
window.addEventListener("keyup",function(e){ if(e.key==="a"||e.key==="A") flying=false; });
gameWrap.addEventListener("pointerdown",function(e){
  if(e.target===startBtn) return;
  flying=true;
  if(e.cancelable) e.preventDefault();
});
window.addEventListener("pointerup",function(){ flying=false; });
window.addEventListener("pointercancel",function(){ flying=false; });
gameWrap.addEventListener("touchstart",function(e){
  if(e.target===startBtn) return;
  if(e.cancelable) e.preventDefault();
},{passive:false});
gameWrap.addEventListener("contextmenu",function(e){ e.preventDefault(); });
startBtn.addEventListener("touchend",function(e){
  e.preventDefault(); e.stopPropagation(); startGame();
},{passive:false});

startBtn.addEventListener("click",function(){ startGame(); });
function startGame(){
  state="playing"; score=0;
  butterfly={ y:CONFIG.H/2, vy:0 };
  obstacles=[]; spawnX=CONFIG.W+CONFIG.speed*CONFIG.graceFrames+120;
  graceLeft=CONFIG.graceFrames; flying=false;
  hudScore.textContent="0";
  overlay.classList.add("hidden");
}
function gameOver(){
  state="over";
  title.textContent="游戏结束";
  tip.style.display="none";
  finalEl.style.display="block";
  finalEl.textContent="得分："+score;
  startBtn.textContent="再来一局";
  overlay.classList.remove("hidden");
}
function update(){
  frames++;
  if(state!=="playing") return;
  if(graceLeft>0){
    graceLeft--;
    butterfly.y=CONFIG.H/2+Math.sin(frames*0.06)*8;
    butterfly.vy=0;
    if(flying) graceLeft=0;
  }else{
    butterfly.vy+=flying?CONFIG.thrust:CONFIG.gravity;
    butterfly.vy=Math.max(CONFIG.maxUp,Math.min(CONFIG.maxDown,butterfly.vy));
    butterfly.y+=butterfly.vy;
  }
  var top=butterfly.y-CONFIG.butterflyR, bot=butterfly.y+CONFIG.butterflyR;
  if(top<0||bot>CONFIG.H){ butterfly.y=Math.max(0,Math.min(CONFIG.H,butterfly.y)); gameOver(); return; }
  var i,ob;
  for(i=0;i<obstacles.length;i++) obstacles[i].x-=CONFIG.speed;
  spawnX-=CONFIG.speed;
  if(spawnX<=CONFIG.W){
    var gapY=60+Math.random()*(CONFIG.H-120-CONFIG.gapH);
    obstacles.push({x:CONFIG.W+CONFIG.obstacleW,gapY:gapY,passed:false});
    spawnX+=CONFIG.spawnGap;
  }
  var alive=[];
  for(i=0;i<obstacles.length;i++){ if(obstacles[i].x+CONFIG.obstacleW>0) alive.push(obstacles[i]); }
  obstacles=alive;
  var bx=CONFIG.butterflyX, r=CONFIG.butterflyR;
  for(i=0;i<obstacles.length;i++){
    ob=obstacles[i];
    if(!ob.passed && ob.x+CONFIG.obstacleW<bx-r){ ob.passed=true; score++; hudScore.textContent=score; }
    if(bx+r>ob.x && bx-r<ob.x+CONFIG.obstacleW){
      if(butterfly.y-r<ob.gapY || butterfly.y+r>ob.gapY+CONFIG.gapH){ gameOver(); return; }
    }
  }
}
function drawBackground(){
  var sky=ctx.createLinearGradient(0,0,0,CONFIG.H);
  sky.addColorStop(0,"#87c6f5"); sky.addColorStop(1,"#d9ecff");
  ctx.fillStyle=sky; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  ctx.fillStyle="rgba(255,255,255,.7)";
  for(var i=0;i<3;i++){
    var cx=(CONFIG.W-((frames*0.3+i*200)%(CONFIG.W+120)))+60, cy=90+i*70;
    ctx.beginPath();
    ctx.arc(cx,cy,26,0,Math.PI*2); ctx.arc(cx+28,cy-10,20,0,Math.PI*2); ctx.arc(cx+52,cy,24,0,Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle="#7ec850"; ctx.fillRect(0,CONFIG.H-28,CONFIG.W,28);
  ctx.fillStyle="#68b03c"; ctx.fillRect(0,CONFIG.H-28,CONFIG.W,8);
}
function drawObstacle(ob){
  var g=ctx.createLinearGradient(ob.x,0,ob.x+CONFIG.obstacleW,0);
  g.addColorStop(0,"#4aa04a"); g.addColorStop(0.5,"#5fb85f"); g.addColorStop(1,"#3d8b3d");
  ctx.fillStyle=g;
  var topH=ob.gapY, botY=ob.gapY+CONFIG.gapH;
  ctx.fillRect(ob.x,0,CONFIG.obstacleW,topH);
  ctx.fillRect(ob.x,botY,CONFIG.obstacleW,CONFIG.H-botY);
  ctx.fillStyle="#2f6e2f";
  ctx.fillRect(ob.x-5,topH-14,CONFIG.obstacleW+10,14);
  ctx.fillRect(ob.x-5,botY,CONFIG.obstacleW+10,14);
}
function drawButterfly(){
  var x=CONFIG.butterflyX, y=butterfly.y;
  var flap=Math.sin(frames*0.45);
  var tilt=Math.max(-0.4,Math.min(0.5,butterfly.vy*0.05));
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
  ctx.fillStyle="#ff9ad5";
  for(var i=0;i<2;i++){
    ctx.save();
    ctx.scale((i===0?-1:1)*(0.75+0.35*Math.abs(flap)),1);
    ctx.beginPath();
    ctx.ellipse(-2,-9,10,12,-0.5,0,Math.PI*2);
    ctx.ellipse(0,8,8,9,0.4,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#ffc1e6";
    ctx.beginPath(); ctx.ellipse(-3,-10,5,6,-0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ff9ad5";
    ctx.restore();
  }
  ctx.fillStyle="#5a3b2e";
  ctx.beginPath(); ctx.ellipse(0,0,3.5,12,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#5a3b2e"; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-1,-11); ctx.quadraticCurveTo(-6,-18,-8,-20);
  ctx.moveTo(1,-11);  ctx.quadraticCurveTo(6,-18,8,-20);
  ctx.stroke();
  ctx.restore();
}
function draw(){
  drawBackground();
  for(var i=0;i<obstacles.length;i++) drawObstacle(obstacles[i]);
  drawButterfly();
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
